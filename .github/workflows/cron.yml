# Zamanlanmis bakim tetikleyicisi.
#
# Vercel Hobby planinda cron gunde bir kez calisabilir; bu bize takvim
# uretimi icin yeter ama "mactan 24 saat sonra hatirlatma" gibi isler icin
# kaba kalir. GitHub Actions ucretsiz ve sik calisabilir, o yuzden asil
# tetikleyici burasi; Vercel'deki gunluk cron yedek olarak durur.
#
# Not: GitHub zamanlayicisi yogun saatlerde birkac dakika gecikebilir.
# Isler tekrar calistirmaya dayanikli oldugu icin bunun zarari yok.

name: Zamanlanmis bakim

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Bakim ucunu tetikle
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL ya da CRON_SECRET tanimli degil; atlaniyor."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 120 "$CRON_URL")
          cat response.json
          echo
          if [ "$code" != "200" ]; then
            echo "Bakim ucu $code dondu"
            exit 1
          fi
